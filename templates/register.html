<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Register Account</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 24px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #7f8c8d; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #27ae60; }
        .flash-message { background-color: #e74c3c; color: white; padding: 10px; border-radius: 4px; margin-bottom: 20px; text-align: center; font-size: 14px; }
        .link { text-align: center; display: block; margin-top: 15px; color: #3498db; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-message">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="/register" method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Create username" required>
            </div>
            <div class="input-group">
                <label>Account Role</label>
                <select name="role">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher / Examiner</option>
                </select>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create password" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <a href="/login" class="link">Already have an account? Sign In</a>
    </div>
</body>
</html>
